name: MindWave DevSecOps CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security & Vulnerability Scan
        run: npm audit --audit-level=high || true

      - name: Run Matrix DevSecOps Automated Tests
        run: node --test tests/*.spec.js

      - name: Verify Store Manifests & Universal Links
        run: |
          test -f public/.well-known/apple-app-site-association
          test -f public/.well-known/assetlinks.json
          test -f ios/App/App/PrivacyInfo.xcprivacy
          test -f android/variables.gradle
          grep "targetSdkVersion = 36" android/variables.gradle

      - name: Build Production Distribution
        run: npm run build
