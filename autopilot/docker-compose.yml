  #     - "8188:8188"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   volumes:
  #     - ./comfy_models:/app/ComfyUI/models
  #     - ./comfy_output:/app/ComfyUI/output

  # ── PostHog: Analytics & Tracking ─────────────────────────
  posthog:
    image: posthog/posthog:latest
    container_name: sentaient_posthog
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "8010:8000"
    environment:
      - POSTHOG_POSTGRES_HOST=postgres
      - POSTHOG_REDIS_HOST=redis

  # ── Mem0: Long-Term Agent Memory ──────────────────────────
  mem0:
    image: mem0ai/mem0:latest
    container_name: sentaient_mem0
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_URL=postgresql://n8n:SigmaNu2003x@postgres:5432/n8n
      - REDIS_URL=redis://redis:6379/1

