      window.LIGHTSPEED_CONFIG = {
        source: "sentaient.com", // This tells it to track Sentaient!

        anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpid25wY2xueGFtaXlud3BkYmVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMzk5NDgsImV4cCI6MjA5OTcxNTk0OH0.0GkslQpzdsatDNI5qLuccamMAG_PATIpAW988FIUuO8"
      };
      // The actual tracker code:
      window.addEventListener('load', () => {
        setTimeout(() => {
          try {
            const config = window.LIGHTSPEED_CONFIG;
            let loadTimeMs = 0;
            
            const navEntries = performance.getEntriesByType("navigation");
            if (navEntries.length > 0 && navEntries[0].loadEventEnd > 0) {
              loadTimeMs = navEntries[0].loadEventEnd - navEntries[0].startTime;
            } else {
              const timing = performance.timing;
              loadTimeMs = timing.loadEventEnd - timing.navigationStart;
            }
            if (loadTimeMs > 0 && loadTimeMs <= 60000) {
              fetch(`${config.supabaseUrl}/rest/v1/metrics`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': config.anonKey,
                  'Authorization': `Bearer ${config.anonKey}`
                },
                body: JSON.stringify({
                  site: config.source,
                  metric_name: 'page_load_time',
                  value: loadTimeMs
                }),
                keepalive: true
              });
            }
          } catch (e) {
            console.error("Lightspeed Tracker Error:", e);
          }
        }, 0);
      });
    </script>
