version: "3.8"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  orchestrator:
    build: 
      context: ./orchestrator
    environment:
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis

  scheduler:
    build: 
      context: ./orchestrator
    command: ["node", "scheduler.js"]
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
