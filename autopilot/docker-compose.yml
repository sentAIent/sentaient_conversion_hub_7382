#version: "3.9"

# ═══════════════════════════════════════════════════════════
#  SentAIent Orchestrator — Marketing Stack
#  Directory: /marketing
#  Start: docker-compose up -d
#  Stop:  docker-compose down
# ═══════════════════════════════════════════════════════════

networks:
  marketing_net:
    driver: bridge

volumes:
  n8n_data:
  langflow_data:
  redis_data:
  minio_data:
  postgres_data:

services:

  # ── n8n: Orchestration Brain ──────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: sentaient_n8n
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "5678:5678"
    environment:
      - N8N_RUNNERS_GRANT_TOKEN_TTL=300
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=America/Los_Angeles
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGFLOW_URL=http://langflow:7860
      - MINIO_ENDPOINT=http://minio:9000
      - REDIS_URL=redis://redis:6379
      - N8N_RUNNERS_GRANT_TOKEN_TTL=300
      - N8N_RESTRICT_FILE_ACCESS_TO=
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=SigmaNu2003x
    volumes:
      - n8n_data:/home/node/.n8n
      - ./media:/marketing/media
      - ./config/brand-house-codes.json:/home/node/brand-house-codes.json
    depends_on:
      - redis
      - minio
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Langflow: Agent & Prompt Builder ─────────────────────
  langflow:
    image: langflowai/langflow:latest
    init: true
    container_name: sentaient_langflow
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_SECRET_KEY=${LANGFLOW_SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGFLOW_STORE_ENVIRONMENT_VARIABLES=true
      - LANGFLOW_AUTO_LOGIN=false
      - DO_NOT_TRACK=true
      - LANGFLOW_HOST=0.0.0.0
    volumes:
      - langflow_data:/app/langflow
      - ./config/brand-house-codes.json:/app/config/brand-house-codes.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://sentaient_langflow:7860"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis: Job Queue & Cache ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentaient_redis
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── MinIO: Asset Storage (S3-compatible) ─────────────────
  minio:
    image: minio/minio:latest
    container_name: sentaient_minio
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MCP Server: Antigravity IDE Integration ───────────────
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: sentaient_mcp
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "3100:3100"
    environment:
      - MCP_PORT=3100
      - N8N_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BRAND_CODES_PATH=/config/brand-house-codes.json
    volumes:
      - ./config:/config:ro
      - ./media:/marketing/media
    depends_on:
      - n8n
      - redis

  # ── Campaign API: HTTP intake endpoint ───────────────────
  campaign_api:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.api
    container_name: sentaient_campaign_api
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/campaign-intake
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BRAND_CODES_PATH=/config/brand-house-codes.json
      - MEDIA_OUTPUT_PATH=/marketing/media/staging
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MUAPI_API_KEY=${MUAPI_API_KEY}
    volumes:
      - ./config:/config:ro
      - ./media:/marketing/media
    depends_on:
      - n8n
      - redis
      - minio

  # ── Postgres: Database ─────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sentaient_postgres
    restart: unless-stopped
    networks:
      - marketing_net
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=SigmaNu2003x
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dashboard: Marketing Control Surface ─────────────────
  dashboard:
    image: nginx:alpine
    container_name: sentaient_dashboard
    restart: unless-stopped
    networks:
      - marketing_net
    ports:
      - "8090:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - campaign_api
      - n8n

  # ── OpenMontage: Video Rendering Engine ───────────────────
  openmontage:
    image: python:3.10-slim
    container_name: sentaient_openmontage
    restart: unless-stopped
    networks:
      - marketing_net
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FAL_KEY=${FAL_KEY}
    volumes:
      - ./openmontage:/app
      - ./media/renders:/app/renders
    command: >
      bash -c "apt-get update && apt-get install -y ffmpeg nodejs npm && pip install -r requirements.txt && uvicorn api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # ── Browser-Use: Automated Browser Agent ──────────────────
  # browser_use:
