<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightSpeed - Offline</title>
    <style>
        body {
            background-color: #0a192f;
            color: #64ffda;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        p { color: #8892b0; margin-bottom: 30px; }
        button {
            background-color: transparent;
            color: #64ffda;
            border: 1px solid #64ffda;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: rgba(100, 255, 218, 0.1);
        }
    </style>
</head>
<body>
    <h1>⚠️ No Internet Connection</h1>
    <p>You are currently offline. LightSpeed will automatically reconnect when your signal returns.</p>
    <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
