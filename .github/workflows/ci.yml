name: E2E Tests & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Run npm audit
        run: npm audit --audit-level=high

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run Supabase Zero-Downtime Migrations
        # In a real environment, you'd use SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID secrets
        # run: npx supabase db push
        run: echo "Supabase db push step (mocked for CI)"

      - name: Set up Playwright
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Lint SQL files (SQLFluff)
        uses: sqlfluff/sqlfluff-github-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          sqlfluff_version: "2.3.2"
          sqlfluff_command: "lint"
          sqlfluff_args: "--dialect postgres"
        continue-on-error: true
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
