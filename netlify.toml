[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/icebreaker"
  to = "https://sentaient-icebreaker-857.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/icebreaker/*"
  to = "https://sentaient-icebreaker-857.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/icebusiness"
  to = "https://sentaient-icebusiness-hub.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/icebusiness/*"
  to = "https://sentaient-icebusiness-hub.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/iceadmin"
  to = "https://sentaient-iceadmin-hub.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/iceadmin/*"
  to = "https://sentaient-iceadmin-hub.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/lightspeed"
  to = "https://sentaient-lightspeed.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/lightspeed/*"
  to = "https://sentaient-lightspeed.netlify.app/:splat"
  status = 200
  force = true



[[redirects]]
  from = "/legaleagle/*"
  to = "/legaleagle/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https:; font-src 'self' data: https:;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
