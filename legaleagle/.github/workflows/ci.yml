name: Legal Eagle CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Security Audit (Dependency Scanning)
      run: npm audit --audit-level=high
      
    - name: Lint and Static Analysis
      run: npm run lint
      
    - name: Test AI Eval Harness
      run: npm run eval
      
    - name: Build Web App
      run: npm run build
      
    - name: Validate Capacitor Mobile Build readiness
      run: npx cap sync
