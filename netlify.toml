[build]
  command = "echo \"Deploying prebuilt dist...\""
  publish = "dist"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/icebreaker"
  to = "https://sentaient-icebreaker-857.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/icebreaker/*"
  to = "https://sentaient-icebreaker-857.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/icebusiness"
  to = "https://sentaient-icebusiness-hub.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/icebusiness/*"
  to = "https://sentaient-icebusiness-hub.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/iceadmin"
  to = "https://sentaient-iceadmin-hub.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/iceadmin/*"
  to = "https://sentaient-iceadmin-hub.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/lightspeed/*"
  to = "/lightspeed/index.html"
  status = 200



[[redirects]]
  from = "/legaleagle/*"
  to = "/legaleagle/index.html"
  status = 200

[[redirects]]
  from = "/autopilot"
  to = "https://sentaient-autopilot-hub.netlify.app/autopilot/"
  status = 200
  force = true

[[redirects]]
  from = "/autopilot/*"
  to = "https://sentaient-autopilot-hub.netlify.app/autopilot/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sphinx"
  to = "/sphinx/index.html"
  status = 200

[[redirects]]
  from = "/sphinx/*"
  to = "/sphinx/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https://*.supabase.co wss://*.supabase.co https://*.posthog.com https://*.firebaseio.com https://*.googleapis.com https://api.stripe.com https://cdn.jsdelivr.net https://api.open-meteo.com https://*.open-meteo.com https://api.rainviewer.com https://*.rainviewer.com https://*.openstreetmap.org https://*.arcgisonline.com https://*.basemaps.cartocdn.com https://demotiles.maplibre.org https://*.mapbox.com https://*.komoot.io https://*.project-osrm.org; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://js.stripe.com https://www.google.com; worker-src 'self' blob:; report-uri /.netlify/functions/csp-report;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()"

# Item 41: Caching & SWR Headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["livekit-server-sdk", "crawlee"]
