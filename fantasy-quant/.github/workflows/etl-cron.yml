name: FantasyQuant ETL Pipeline

on:
  schedule:
    # Run every morning at 6:00 AM UTC (2:00 AM EST) during the NFL season
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase python-dotenv

      - name: Run NFL.com Scraper (Historical/Weekly Data)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python etl/scrape_nfl.py --season 2023

      # Add future scrapers here (e.g., weather, injuries)
      # - name: Run Weather Scraper
      #   env: ...
      #   run: python etl/scrape_weather.py
