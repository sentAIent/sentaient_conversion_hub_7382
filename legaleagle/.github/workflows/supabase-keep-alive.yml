name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC on Wednesday and Sunday (twice a week)
    - cron: '0 0 * * 0,3'
  workflow_dispatch:
    # Allows you to trigger this workflow manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_ANON_KEY is not set."
            exit 1
          fi

          echo "Pinging Supabase to prevent inactivity pause..."
          
          # Perform a simple GET request to the profiles table (fetching 1 record)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
            echo "Success! Received HTTP $HTTP_STATUS from Supabase."
            echo "Note: 401/403 is fine, it still counts as an API request for keep-alive purposes."
          else
            echo "Failed to reach Supabase. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
