[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/icebreaker"
  to = "https://sentaient-icebreaker-857.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/icebreaker/*"
  to = "https://sentaient-icebreaker-857.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/icebusiness"
  to = "https://sentaient-icebusiness-hub.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/icebusiness/*"
  to = "https://sentaient-icebusiness-hub.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/iceadmin"
  to = "https://sentaient-iceadmin-hub.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/iceadmin/*"
  to = "https://sentaient-iceadmin-hub.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/lightspeed/*"
  to = "/lightspeed/index.html"
  status = 200



[[redirects]]
  from = "/legaleagle/*"
  to = "/legaleagle/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; connect-src 'self' http://localhost:3335 ws://localhost:3335 http://localhost:8065 ws://localhost:8065 https://*.supabase.co wss://*.supabase.co https://*.posthog.com https://*.firebaseio.com https://*.googleapis.com https://api.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://js.stripe.com; report-uri /.netlify/functions/csp-report;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()"

# Item 41: Caching & SWR Headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=31536000, stale-while-revalidate=86400"
