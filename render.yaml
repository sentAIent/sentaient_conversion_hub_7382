services:
  - type: web
    name: icebreaker-backend
    runtime: node
    rootDir: icebreaker/backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
