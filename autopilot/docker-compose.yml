  #     - "9222:9222" # CDP Debug Port
  #   environment:
  #     - CHROME_BIN=/usr/bin/google-chrome-stable

  # ── ComfyUI: GPU Media Generation ─────────────────────────
  # comfyui:
  #   image: yanweiguo/comfyui:latest
  #   container_name: sentaient_comfyui
  #   restart: unless-stopped
  #   networks:
  #     - marketing_net
