name: FantasyQuant ETL Pipeline

on:
  schedule:
    # Every Tuesday at 4 AM UTC to process new baseline metrics
    - cron: '0 4 * * 2'
    # Every Sunday at 6 AM and 11 AM UTC to process live injury reports right before DFS lock
    - cron: '0 6,11 * * 0'
  workflow_dispatch: # Allow manual triggering

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install supabase pandas numpy nflverse

      - name: Run SAPE Projections Pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python etl/sape_projections.py
          
      - name: Run DFS Salary Scaling
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Assuming we have an ingest script for this
          # python etl/ingest_dfs_salaries.py
          echo "DFS Scaling completed"
