[[headers]]
  for = "/*"
  [headers.values]
    # Restrict where resources can be loaded from to prevent XSS attacks.
    # Allowing 'self', Supabase (for backend), and inline scripts/styles which are common in Vite/React apps.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https:; font-src 'self' data: https:;"
    
    # Enforce HTTPS on all connections to the site for the next year (including subdomains)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Prevent clickjacking by not allowing the site to be embedded in an iframe on external domains
    X-Frame-Options = "DENY"
    
    # Prevent browsers from MIME-sniffing a response away from the declared content-type
    X-Content-Type-Options = "nosniff"
    
    # Protect user privacy by limiting referrer information passed to external domains
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Prevent XSS attacks in older browsers (deprecated in modern browsers in favor of CSP, but good for legacy)
    X-XSS-Protection = "1; mode=block"
    
    # Restrict access to device hardware and APIs to prevent abuse
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
